spring.datasource.url=jdbc:mysql://localhost:3306/localBazaar
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
server.port=8080

# Email configuration - replace with actual values in production
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio configuration - replace with actual values in production
twilio.account.sid=your-account-sid
twilio.auth.token=your-auth-token
twilio.phone.number=your-phone-number

# JWT configuration
jwt.secret=replace-with-your-secret-key-in-production
jwt.expiration=86400000